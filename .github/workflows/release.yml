name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing annotated tag, e.g. v1.0.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Draft Release (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 240
    permissions:
      contents: write
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: "refs/tags/${{ env.TAG }}"
          fetch-depth: 0

      - name: Restore annotated tags
        shell: pwsh
        run: |
          git fetch --force --tags origin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Refuse existing release
        shell: pwsh
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) { Write-Error "Release $env:TAG already exists"; exit 1 }
          exit 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements.lock
            pyproject.toml

      - name: Create venv and install locked dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv\Scripts\python.exe -m pip install -r requirements.txt -r requirements-dev.txt -c requirements.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv\Scripts\python.exe -m pip install --no-build-isolation --no-deps -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Full quality gate
        shell: pwsh
        run: |
          .venv\Scripts\python.exe scripts/ci_gate.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Derive version from tag
        shell: pwsh
        run: '"VER=$($env:TAG.TrimStart(''v''))" >> $env:GITHUB_ENV'

      - name: Nuitka standalone build
        shell: cmd
        run: scripts\build_nuitka.bat standalone Malaz-%VER%

      - name: Assemble verified release set
        shell: pwsh
        run: |
          .venv\Scripts\python.exe scripts/make_release.py --tag $env:TAG --binary-zip "dist/Malaz-$env:VER.zip" --out dist/release-out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create draft release
        shell: pwsh
        run: |
          $assets = (Get-ChildItem dist/release-out -File).FullName
          gh release create $env:TAG --draft --verify-tag --title "Malaz $env:VER" --notes-file CHANGELOG.md @assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
